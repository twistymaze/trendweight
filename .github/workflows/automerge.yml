name: automerge
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, review_requested]
permissions:
  contents: write
  pull-requests: write
jobs:
  call:
    # Release Please upgrades need review even when the shared preset labels them.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'manual-review') }}
    uses: twistymaze/renovate-config/.github/workflows/automerge.yml@d7ded64bc0ce5a40561591f1a44f267903d41a39 # main
    with:
      app-client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
