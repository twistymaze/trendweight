name: Release PRs

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-main
  cancel-in-progress: false

# The release step authenticates with RELEASE_PLEASE_TOKEN; GITHUB_TOKEN only
# needs to check out the repository.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Verify release configuration
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_PLEASE_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Missing required GitHub Actions secret: RELEASE_PLEASE_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Use pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test release customization
        run: node --test .github/scripts/release-please.test.mjs

      - name: Update releases and release PR
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: node .github/scripts/release-please.mjs
